[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
gctl-proto = { path = "crates/gctl-proto" }
clap = { version = "4.6", features = ["derive"] }
hidapi = "2.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
